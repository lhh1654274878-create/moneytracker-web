<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入数据 - 钱迹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 8px;
        }

        .desc {
            color: #6B7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .upload-area {
            background: white;
            padding: 40px;
            border-radius: 12px;
            border: 2px dashed #D1D5DB;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #3B82F6;
            background: #F0F9FF;
        }

        .upload-area.dragover {
            border-color: #3B82F6;
            background: #EFF6FF;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .upload-text {
            color: #1F2937;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: #9CA3AF;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .preview {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .preview h2 {
            font-size: 18px;
            color: #1F2937;
            margin-bottom: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: #F9FAFB;
            padding: 16px;
            border-radius: 8px;
        }

        .stat-label {
            color: #6B7280;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .stat-value {
            color: #1F2937;
            font-size: 24px;
            font-weight: 600;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3B82F6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563EB;
        }

        .btn-primary:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: white;
            color: #3B82F6;
            border: 2px solid #3B82F6;
            margin-top: 12px;
        }

        .message {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #D1FAE5;
            color: #065F46;
        }

        .message.error {
            background: #FEE2E2;
            color: #991B1B;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 导入数据</h1>
            <p class="desc">支持从「轻记账」导出的 JSON 格式备份文件</p>
        </div>

        <div id="message" class="message"></div>

        <div id="uploadArea" class="upload-area">
            <div class="upload-icon">📁</div>
            <div class="upload-text">点击或拖拽文件到此处</div>
            <div class="upload-hint">支持 .json 格式</div>
            <input type="file" id="fileInput" accept=".json">
        </div>

        <div id="preview" class="preview">
            <h2>数据预览</h2>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">交易记录</div>
                    <div class="stat-value" id="billCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">分类数量</div>
                    <div class="stat-value" id="catCount">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">总支出</div>
                    <div class="stat-value" style="color: #EF4444;" id="totalExpense">¥0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">总收入</div>
                    <div class="stat-value" style="color: #10B981;" id="totalIncome">¥0</div>
                </div>
            </div>
            <button class="btn btn-primary" id="importBtn">确认导入</button>
            <button class="btn btn-secondary" id="cancelBtn">取消</button>
        </div>
    </div>

    <script>
        let importData = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const message = document.getElementById('message');

        // 点击上传
        uploadArea.addEventListener('click', () => fileInput.click());

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // 处理文件
        function handleFile(file) {
            if (!file.name.endsWith('.json')) {
                showMessage('error', '仅支持 JSON 格式文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.bills || !Array.isArray(data.bills)) {
                        showMessage('error', '文件格式不正确');
                        return;
                    }
                    importData = data;
                    showPreview(data);
                } catch (error) {
                    showMessage('error', '文件解析失败：' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // 显示预览
        function showPreview(data) {
            const bills = data.bills || [];
            const cats = data.cats || [];
            
            const totalExpense = bills
                .filter(b => b.type === 'expense')
                .reduce((sum, b) => sum + b.amount, 0);
            
            const totalIncome = bills
                .filter(b => b.type === 'income')
                .reduce((sum, b) => sum + b.amount, 0);

            document.getElementById('billCount').textContent = bills.length;
            document.getElementById('catCount').textContent = cats.length;
            document.getElementById('totalExpense').textContent = '¥' + totalExpense.toFixed(2);
            document.getElementById('totalIncome').textContent = '¥' + totalIncome.toFixed(2);

            uploadArea.style.display = 'none';
            preview.style.display = 'block';
        }

        // 确认导入
        document.getElementById('importBtn').addEventListener('click', () => {
            if (!importData) return;

            try {
                // 转换数据格式
                const categories = {};
                const catMap = {};

                // 转换分类
                importData.cats.forEach(cat => {
                    const type = cat.type === 'expense' ? 'expense' : 'income';
                    if (!categories[type]) categories[type] = [];
                    categories[type].push({
                        id: cat.id,
                        name: cat.name,
                        icon: cat.icon,
                        color: cat.color
                    });
                    catMap[cat.id] = cat.name;
                });

                // 转换交易记录（增强字段验证）
                const transactions = importData.bills.map((bill, index) => {
                    // 验证必填字段
                    if (!bill.type || !bill.amount || !bill.date) {
                        throw new Error(`第${index + 1}条记录缺少必填字段：type=${bill.type}, amount=${bill.amount}, date=${bill.date}`);
                    }
                    
                    // 验证类型合法性
                    if (bill.type !== 'expense' && bill.type !== 'income') {
                        throw new Error(`第${index + 1}条记录类型错误：${bill.type}，只能是 expense 或 income`);
                    }
                    
                    // 验证金额格式
                    const amount = parseFloat(bill.amount);
                    if (isNaN(amount) || amount <= 0) {
                        throw new Error(`第${index + 1}条记录金额无效：${bill.amount}`);
                    }
                    
                    return {
                        id: bill.id || `import_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                        type: bill.type,
                        amount: amount,
                        category: catMap[bill.cat] || '其他',
                        note: bill.remark || '',
                        date: bill.date + 'T12:00:00',
                        account: '现金'
                    };
                });

                // 保存到 localStorage（合并模式，不覆盖现有数据）
                const existingData = JSON.parse(localStorage.getItem('moneytracker_data') || '{}');
                
                // 合并交易记录（去重）
                const existingTransactions = existingData.transactions || [];
                const existingIds = new Set(existingTransactions.map(t => t.id));
                const newTransactions = transactions.filter(t => !existingIds.has(t.id));
                
                // 合并分类（保留现有分类）
                const mergedCategories = {
                    expense: existingData.categories?.expense || [],
                    income: existingData.categories?.income || []
                };
                
                // 添加新分类（去重）
                ['expense', 'income'].forEach(type => {
                    const existingCatNames = new Set(mergedCategories[type].map(c => c.name));
                    const newCats = (categories[type] || []).filter(c => !existingCatNames.has(c.name));
                    mergedCategories[type].push(...newCats);
                });
                
                const newData = {
                    transactions: [...existingTransactions, ...newTransactions],
                    categories: mergedCategories,
                    accounts: existingData.accounts || [
                        { id: '1', name: '现金', balance: 0, type: 'cash' }
                    ],
                    settings: existingData.settings || {
                        currency: '¥',
                        startOfWeek: 1,
                        budgetAlert: true,
                        monthlyBudget: 0
                    }
                };

                localStorage.setItem('moneytracker_data', JSON.stringify(newData));
                
                showMessage('success', `成功导入 ${transactions.length} 条记录！`);
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (error) {
                showMessage('error', '导入失败：' + error.message);
            }
        });

        // 取消
        document.getElementById('cancelBtn').addEventListener('click', () => {
            importData = null;
            preview.style.display = 'none';
            uploadArea.style.display = 'block';
            fileInput.value = '';
        });

        // 显示消息
        function showMessage(type, text) {
            message.className = 'message ' + type;
            message.textContent = text;
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
